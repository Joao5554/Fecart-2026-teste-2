[pytest]
# Só a pasta testes/ é coletada. Sem isto, o pacote gerado por
# ferramentas/preparar_apresentacao.py (que leva uma cópia dos testes junto)
# faz o pytest encontrar dois arquivos com o mesmo nome e falhar na coleta.
testpaths = testes

norecursedirs = apresentacao .venv .git dados modelo __pycache__

addopts = -q
